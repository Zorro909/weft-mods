[package]
name = "plotty"
version = "0.1.0"
edition = "2024"
# As the engine's `Cargo.toml` declares; cargo then picks dependency versions that build with it.
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Weft release it builds against, from the game's repository as the mod index wants it;
# `init.sh` checks out the newest one any mod names into `Weft/`.
weft_sdk = { git = "https://github.com/Weft-Rust/Weft", tag = "v26.11.5" }
base_api = { git = "https://github.com/Weft-Rust/Weft", tag = "v26.11.5" }
# Player keys, positions, the settings file and the tables Plotty keeps its data in.
weftkit = { path = "../weftkit", features = ["config", "store"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Reads a settings text in tests, as `ConfigFile` does.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Writes the pictures `src/art.rs` draws.
png = "0.18"

# Its own cargo root.
[workspace]

[profile.release]
debug = "line-tables-only"
