[package]
name = "structgen"
version = "0.3.0"
edition = "2024"
# As the engine's `Cargo.toml` declares; cargo then picks dependency versions that build with it.
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
weft_sdk.workspace = true
base_api.workspace = true
structgen_api = { path = "api" }
showcase_api = { path = "../showcase/api", optional = true }

[features]
# Builds the film (`src/films/`), played by the showcase mod: `--features showcase`.
showcase = ["dep:showcase_api"]

# Its own cargo root. `cargo build` and `cargo test` here cover `structgen_api` too.
[workspace]
members = ["api"]
default-members = [".", "api"]

# The Weft release the mod and its API crate build against, from the game's repository as the
# mod index wants it; `init.sh` checks out the newest one any mod names into `Weft/`.
[workspace.dependencies]
weft_sdk = { git = "https://github.com/Weft-Rust/Weft", tag = "v26.11.3" }
base_api = { git = "https://github.com/Weft-Rust/Weft", tag = "v26.11.3" }

[profile.release]
debug = "line-tables-only"
