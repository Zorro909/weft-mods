# Releases the mods with Zorro909/weft-mod-action on every push to main. Each release holds
# `<id>.zip`, with the mod's Windows, Linux and macOS builds, and `<id>.mod.json` for the Weft mod
# index, with attested build provenance.
#   - A mod whose crate version has no release yet is released as it is: a full release for
#     `X.Y.Z`, a release candidate for `X.Y.Z-rc.N`.
#   - A mod that changed since its newest release (its folder or the Weft submodule) gets a
#     release candidate after it, `X.Y.(Z+1)-rc.<run>.g<commit>`. That version goes into the
#     build only; nothing is committed.
# Then README.md lists the newest release of every mod and each version before. Its commit goes to
# main over SSH with the deploy key in the secret `RELEASE_DEPLOY_KEY`, which the ruleset on main
# lets through, and says `[skip ci]`, so it starts no workflow run.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run plans from the tags the one before it made.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        # ubuntu-22.04: a Linux library runs on the glibc it was built with or newer.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Every mod folder; a new mod is added here, in check.yml and in index-pr.yml.
      - uses: Zorro909/weft-mod-action/build@v1
        with:
          mods: |
            cogwork
            showcase
            structures

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: Zorro909/weft-mod-action/release@v1

  # Also when nothing was released, or the release failed: it commits only when the section
  # changes. Not for a run started by hand on another branch, which mustn't push to main. The
  # tags tell which Weft each release was built against.
  readme:
    needs: release
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Update README.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/update-readme.sh main
