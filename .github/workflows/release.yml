# Releases the mods with Zorro909/weft-mod-action on every push to main. Each release holds
# `<id>.zip`, with the mod's Windows, Linux and macOS libraries and its assets.
#   - A mod whose crate version has no release yet is released as it is: a full release for
#     `X.Y.Z`, a release candidate for `X.Y.Z-rc.N`.
#   - A mod that changed since its newest release (its folder, with the Weft tag in its
#     `Cargo.toml`) gets a release candidate after it, `X.Y.(Z+1)-rc.<run>.g<commit>`. That
#     version goes into the build only; nothing is committed.
# Off until the repository variable WEFT_INDEX_PR is `true`: the index-pr job proposes each full
# release to the Weft mod index, with the secret WEFT_INDEX_TOKEN (see index-pr.yml).
# Then README.md lists the newest release of every mod and each version before. Its commit goes to
# main over SSH with the deploy key in the secret `RELEASE_DEPLOY_KEY`, which the ruleset on main
# lets through, and says `[skip ci]`, so it starts no workflow run.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run plans from the tags the one before it made.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        # ubuntu-22.04: a Linux library runs on the glibc it was built with or newer.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Every mod folder; a new mod is added here, in check.yml and in index-pr.yml.
      - uses: Zorro909/weft-mod-action/build@main
        with:
          mods: |
            cogwork
            serverscript
            showcase
            structgen

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.release.outputs.releases }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - id: release
        uses: Zorro909/weft-mod-action/release@main

  # Each full release (`X.Y.Z`, no release candidate), to the Weft mod index.
  index-pr:
    needs: release
    if: needs.release.outputs.releases != '' && vars.WEFT_INDEX_PR == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: Zorro909/weft-mod-action/index-pr@main
        with:
          token: ${{ secrets.WEFT_INDEX_TOKEN }}
          tags: ${{ needs.release.outputs.releases }}
          mods: |
            cogwork
            serverscript
            showcase
            structgen

  # Also when nothing was released, or the release failed: it commits only when the section
  # changes. Not for a run started by hand on another branch, which mustn't push to main. The
  # tags tell which Weft each release was built against.
  readme:
    needs: release
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Update README.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/update-readme.sh main
