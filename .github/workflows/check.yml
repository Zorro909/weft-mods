# Checks a pull request: its Rust is formatted, every mod's version can be released (a full one
# only on a tagged Weft), every mod's unit tests and clippy pass, the tests of the CI scripts in
# `tools/ci` pass, and every mod builds for Windows, Linux and macOS against the Weft the
# submodule pins.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # For `group_imports` in `rustfmt.toml`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # Every Rust file git tracks; the Weft submodule is formatted upstream.
      - name: Rust is formatted
        run: |
          if ! git ls-files -z '*.rs' | xargs -0 rustfmt +nightly --check; then
            echo "::error::Unformatted Rust; run git ls-files -z '*.rs' | xargs -0 rustfmt +nightly and commit the result."
            exit 1
          fi

  # What merging would release, by the planner `release.yml` runs, which refuses what it can't.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Versions can be released
        run: |
          plan=$(tools/ci/plan-release.sh)
          jq . <<<"$plan"

  # Unit tests and clippy of every mod with all features, the films included.
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Tests and clippy of every mod
        run: tools/check-mods.sh

  ci-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tests of tools/ci
        run: python3 -m unittest discover -s tools/ci

  build:
    uses: ./.github/workflows/build.yml
