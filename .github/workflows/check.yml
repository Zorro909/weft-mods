# Checks a pull request: its Rust is formatted, every mod takes Weft at a release as the mod index
# needs, every mod's unit tests and clippy pass, the tests of the scripts in `tools/ci` and `tools/assets` pass, and
# every mod builds for Windows, Linux and macOS, as `release.yml` builds it.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # For `group_imports` in `rustfmt.toml`.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # Every Rust file git tracks.
      - name: Rust is formatted
        run: |
          if ! git ls-files -z '*.rs' | xargs -0 rustfmt +nightly --check; then
            echo "::error::Unformatted Rust; run git ls-files -z '*.rs' | xargs -0 rustfmt +nightly and commit the result."
            exit 1
          fi

  # Players run Weft releases, so every mod is built against one, as the mod index takes it.
  weft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every mod takes Weft at a release
        run: tools/ci/check-weft.sh

  # Unit tests and clippy of every mod with all features, the films included.
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Tests and clippy of every mod
        run: tools/check-mods.sh

  ci-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tests of tools/ci
        run: python3 -m unittest discover -s tools/ci
      - name: Tests of tools/assets
        run: python3 -m unittest discover -s tools/assets

  # With `release-unchanged`, so that every mod builds, also one that didn't change.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: Zorro909/weft-mod-action/build@main
        with:
          release-unchanged: true
          mods: |
            almanac
            cogwork
            showcase
            structgen
