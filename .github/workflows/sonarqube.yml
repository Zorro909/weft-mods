# Lints every mod with clippy, measures the test coverage of the mods and of the Python scripts in
# `tools/ci`, and sends the code with clippy's findings and the coverage to SonarQube Cloud, on
# every pull request and every push to main. A clippy warning in a mod fails the run, after the
# analysis with it is sent. The analysis needs the secret `SONAR_TOKEN`, which pull requests from
# forks don't get: theirs skip it. The project's settings are in `sonar-project.properties`.
name: SonarQube

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # The whole history, so that SonarQube can tell new code from old.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Third-party actions are pinned to a commit, the tag or branch they track beside it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, llvm-tools-preview

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Clippy report
        run: tools/ci/clippy-report.sh clippy-report.json

      # The steps after the report run when it fails too, so that clippy's findings show.
      - name: Clippy finds nothing
        if: ${{ !cancelled() }}
        run: tools/ci/clippy-findings.sh clippy-report.json

      - name: Rust coverage
        if: ${{ !cancelled() }}
        run: tools/ci/rust-coverage.sh rust-coverage.lcov

      - name: Python coverage
        if: ${{ !cancelled() }}
        run: tools/ci/python-coverage.sh python-coverage.xml

      - name: SonarQube analysis
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
