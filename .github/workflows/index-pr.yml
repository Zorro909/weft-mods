# Run from the Actions tab: opens a pull request on the Weft mod index that adds the newest release
# of each mod, or the tags you name. Needs a classic personal access token with the scope
# `public_repo` as the secret `WEFT_INDEX_TOKEN`; see Zorro909/weft-mod-action's README.
name: Propose to the Weft mod index

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags, separated by spaces (default, the newest release of each mod)
        default: ""

permissions:
  contents: read

jobs:
  index-pr:
    runs-on: ubuntu-latest
    steps:
      # `cargo metadata` of each mod reads its path dependencies into Weft.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: Zorro909/weft-mod-action/index-pr@feat/mod-manager-v2
        with:
          token: ${{ secrets.WEFT_INDEX_TOKEN }}
          tags: ${{ inputs.tags }}
          mods: |
            cogwork
            showcase
            structures
