[package]
name = "structures"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
weft_sdk = { path = "../Weft/crates/sdk" }
base_api = { path = "../Weft/mods/base/api" }
# The compression world saves use for their cubes.
lz4_flex = "0.14"

# Its own cargo root, apart from the engine's workspace in `Weft/`.
[workspace]

[profile.release]
debug = "line-tables-only"
