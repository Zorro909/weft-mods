[package]
name = "structures"
version = "0.1.2"
edition = "2024"
# As `Weft/Cargo.toml` declares; cargo then picks dependency versions that build with it.
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
weft_sdk = { path = "../Weft/crates/sdk" }
base_api = { path = "../Weft/mods/base/api" }
structures_api = { path = "api" }

# Its own cargo root, apart from the engine's workspace in `Weft/`. `cargo build` and
# `cargo test` here cover `structures_api` too.
[workspace]
members = ["api"]
default-members = [".", "api"]

[profile.release]
debug = "line-tables-only"
