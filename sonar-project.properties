# SonarQube Cloud analysis, run by `.github/workflows/sonarqube.yml`.
sonar.organization=zorro909
sonar.projectKey=Zorro909_weft-mods
sonar.projectName=weft-mods

# The engine in `Weft/` is analysed upstream; build output and the reports aren't source. The tests
# of `tools/ci` and `tools/assets` are tests; a mod's Rust tests sit in its source files.
sonar.sources=.
sonar.exclusions=Weft/**,**/target/**,clippy-report.json,rust-coverage.lcov,python-coverage.xml,tools/*/test_*.py
sonar.tests=tools/ci,tools/assets
sonar.test.inclusions=tools/*/test_*.py

# Clippy runs in CI as `tools/check-mods.sh` runs it, with all features in release, and Sonar
# imports its report. Sonar's own run would build every mod again without the features.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=clippy-report.json

# Test coverage, measured in CI by `tools/ci/rust-coverage.sh` and `tools/ci/python-coverage.sh`.
sonar.rust.lcov.reportPaths=rust-coverage.lcov
sonar.python.coverage.reportPaths=python-coverage.xml

# Files that only register content or act through the engine (the world, the client, menus): the
# SDK's calls exist only inside the game, so unit tests can't run them, and playing the mods checks
# them. A file with logic of its own stays measured, glue and all; cogwork's films are only built
# for recording, and `tools/blockbench/` only runs against a Blockbench on the developer's machine.
sonar.coverage.exclusions=\
  showcase/src/lib.rs,showcase/src/director.rs,showcase/src/menus.rs,showcase/api/src/set.rs,\
  showcase/src/rehearsal/mod.rs,\
  structgen/src/buildings.rs,structgen/src/villages.rs,structgen/src/settlement/plan.rs,\
  structgen/src/films/**,\
  cogwork/src/cogs.rs,cogwork/src/machine.rs,cogwork/src/shaft.rs,cogwork/src/tube/mod.rs,\
  cogwork/src/engines/mod.rs,cogwork/src/store/mod.rs,cogwork/src/tube/travel.rs,\
  cogwork/src/films/**,\
  tools/blockbench/**
