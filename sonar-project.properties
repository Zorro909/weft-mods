# SonarQube Cloud analysis, run by `.github/workflows/sonarqube.yml`.
sonar.organization=zorro909
sonar.projectKey=Zorro909_weft-mods
sonar.projectName=weft-mods

# The Weft submodule is analysed upstream; build output and the clippy report aren't source.
sonar.exclusions=Weft/**,**/target/**,clippy-report.json

# Clippy runs in CI as `tools/check-mods.sh` runs it, with all features in release, and Sonar
# imports its report. Sonar's own run would build every mod again without the features.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=clippy-report.json
