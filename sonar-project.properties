# SonarQube Cloud analysis, run by `.github/workflows/sonarqube.yml`.
sonar.organization=zorro909
sonar.projectKey=Zorro909_weft-mods
sonar.projectName=weft-mods

# The Weft submodule is analysed upstream; build output and the reports aren't source. The tests
# of `tools/ci` are tests; a mod's Rust tests sit in its source files.
sonar.sources=.
sonar.exclusions=Weft/**,**/target/**,clippy-report.json,rust-coverage.lcov,python-coverage.xml,tools/ci/test_*.py
sonar.tests=tools/ci
sonar.test.inclusions=tools/ci/test_*.py

# Clippy runs in CI as `tools/check-mods.sh` runs it, with all features in release, and Sonar
# imports its report. Sonar's own run would build every mod again without the features.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=clippy-report.json

# Test coverage, measured in CI by `tools/ci/rust-coverage.sh` and `tools/ci/python-coverage.sh`.
sonar.rust.lcov.reportPaths=rust-coverage.lcov
sonar.python.coverage.reportPaths=python-coverage.xml
