# Formatting for new and changed lines only, applied by `tools/fmt-changed.sh` here and in `Weft/`.
# It lives here rather than at the root so that `cargo fmt` and editors leave the hand-formatted
# code alone.
edition = "2024"
style_edition = "2024"
max_width = 100
newline_style = "Unix"

# Nightly only, like the `--file-lines` the script needs.
group_imports = "StdExternalCrate"
