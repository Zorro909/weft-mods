[package]
name = "cogwork"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Weft release it builds against, from the game's repository as the mod index wants it;
# `init.sh` checks out the newest one any mod names into `Weft/`.
weft_sdk = { git = "https://github.com/Weft-Rust/Weft", tag = "v26.11.3" }
base_api = { git = "https://github.com/Weft-Rust/Weft", tag = "v26.11.3" }
strum = { version = "0.28", features = ["derive"] }
# XXH3 alone, for ghost keys.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }
# Only for the films, which releases leave out.
showcase_api = { path = "../showcase/api", optional = true }

[build-dependencies]
# Reads the recipe files in `assets/recipes/` (see `build.rs`).
toml = "1"

[features]
# Builds the films (`src/films/`), played by the showcase mod: `--features showcase`.
showcase = ["dep:showcase_api"]

[workspace]

[profile.release]
debug = "line-tables-only"
