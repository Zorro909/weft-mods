[package]
name = "cogwork"
version = "0.1.2"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
weft_sdk = { path = "../Weft/crates/sdk" }
base_api = { path = "../Weft/mods/base/api" }
# Only for the films, which releases leave out.
showcase_api = { path = "../showcase/api", optional = true }

[features]
# Builds the films (`src/films.rs`), played by the showcase mod: `--features showcase`.
showcase = ["dep:showcase_api"]

[workspace]

[profile.release]
debug = "line-tables-only"
