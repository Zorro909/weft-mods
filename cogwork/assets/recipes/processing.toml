# The hand machines that work what quarries bring up.

[[shaped]]
result = "millstone"
pattern = [" s ", "SSS", "PPP"]
key = { s = "#stick", S = "#smooth_stone", P = "#planks" }

[[shaped]]
result = "sieve"
pattern = ["PtP", "PtP", "s s"]
key = { P = "#planks", t = "base:string", s = "#stick" }

[[shaped]]
result = "shaker_screen"
pattern = ["iSi", "c c", "PPP"]
key = { i = "#ingots/iron", S = "sieve", c = "#cogs/stone", P = "#planks" }

[[shaped]]
result = "grinding_mill"
pattern = ["LcL", "iMi", "SSS"]
key = { L = "#logs", c = "#cogs/stone", i = "#ingots/iron", M = "millstone", S = "#smooth_stone" }
