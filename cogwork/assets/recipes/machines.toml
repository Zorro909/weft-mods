# Engines, the water wheel, the quarries and their drill bits, machines and the survey marker.

[[shaped]]
result = "spring_engine"
pattern = ["ppp", " g ", "cic"]
key = { p = "#planks", g = "base:glass", c = "#cogs/wood", i = "#ingots/iron" }

[[shaped]]
result = "water_wheel"
pattern = ["sps", "pcp", "sps"]
key = { s = "#stick", p = "#planks", c = "#cogs/wood" }

[[shaped]]
result = "ember_engine"
pattern = ["sss", " g ", "cPc"]
key = { s = "#cobblestone", g = "base:glass", c = "#cogs/stone", P = "base:piston" }

[[shaped]]
result = "timber_quarry"
pattern = ["ptp", "cpc", "sts"]
key = { p = "#planks", t = "base:string", c = "#cogs/wood", s = "#cobblestone" }

[[shaped]]
result = "iron_quarry"
pattern = ["ici", "cTc", "iii"]
key = { i = "#ingots/iron", c = "#cogs/iron", T = "timber_quarry" }

[[shaped]]
result = "stone_bit"
pattern = [" k ", "sts", " s "]
key = { k = "#stick", t = "base:string", s = "#cobblestone" }

[[shaped]]
result = "iron_bit"
pattern = [" c ", "iii", " i "]
key = { c = "#cogs/wood", i = "#ingots/iron" }

[[shaped]]
result = "excavator"
pattern = ["iri", "gPg", "dcd"]
key = { i = "#cogs/iron", r = "base:redstone", g = "#cogs/gold", P = "base:diamond_pickaxe", d = "#cogs/diamond", c = "base:chest" }

[[shaped]]
result = "assembly_bench"
pattern = ["iTi", "cCc", "iri"]
key = { i = "#ingots/iron", T = "base:crafting_table", c = "#cogs/iron", C = "base:chest", r = "base:redstone" }

[[shaped]]
result = "leveler"
pattern = ["iri", "gSg", "iCi"]
key = { i = "#ingots/iron", r = "base:redstone", g = "#cogs/gold", S = "#shovels/diamond", C = "base:chest" }

[[shaped]]
result = "survey_marker"
count = 4
pattern = ["t", "s"]
key = { t = "base:redstone_torch", s = "#stick" }
